# Add this to your Hyprland-Dots/config/hypr/UserConfigs/UserKeybinds.conf
# (path is relative to the Arch-Hyprland repo root)

# Toggle JARVIS floating AI assistant
bindd = SUPER, J, Toggle JARVIS AI assistant, exec, $HOME/.config/hypr/ai/jarvis.sh

# Optional: float + size + position rules for the widget window
# (add to Hyprland-Dots/config/hypr/UserConfigs/WindowRules.conf)
windowrulev2 = float, title:^(JARVIS)$
windowrulev2 = size 380 480, title:^(JARVIS)$
windowrulev2 = pin, title:^(JARVIS)$
